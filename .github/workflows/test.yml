name: Test and Coverage

on:
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create Env File
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_CONTENT }}
          EOF

      - name: Install Dependencies
        run: npm ci

      - name: Type Check Source and Tests
        run: npm run test:types

      - name: Create tmp directory for potential mock setups
        run: mkdir -p tmp

      - name: Run Domain and Shared Tests with Coverage
        run: >-
          npx jest src/domain src/shared
          --coverage
          --coverageDirectory="coverage/domain-shared"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Run Application Tests with Coverage
        run: >-
          npx jest src/app
          --coverage
          --coverageDirectory="coverage/app"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Run Infrastructure, Interface, and Test Setup Tests with Coverage
        run: >-
          npx jest src/infra src/interface test/setup
          --coverage
          --coverageDirectory="coverage/infra-interface"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Run HTTP Tests with Coverage
        run: >-
          npx jest test/http
          --coverage
          --coverageDirectory="coverage/http"
          --coverageReporters="json"
          --maxWorkers=2

      - name: Merge Coverage Reports
        run: node scripts/merge-coverage.mjs

      - name: Generate Coverage Badge
        if: github.base_ref == 'development'
        run: |
          mkdir -p badges
          COVERAGE=$(node -e "const summary = require('./coverage/coverage-summary.json'); console.log(summary.total.lines.pct);")
          echo "Coverage is $COVERAGE%"

          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          fi

          curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > badges/coverage.svg

      - name: Upload Coverage Badge
        if: github.base_ref == 'development'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: badges/coverage.svg
          if-no-files-found: error
